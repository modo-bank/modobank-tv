<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>modobank • Analytics TV</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #a9c7e3;
      font-family: Arial, sans-serif;
    }

    #slide {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #a9c7e3;
      transition: opacity 0.6s ease;
    }
  </style>
</head>

<body>

  <img id="slide" src="geral.png" alt="Dashboard modobank" />

  <script>

    const imagens = [
      'geral.png',
      'comercial.png',
      'crescimento.png',
      'tarifas.png',
      'ranking.png',
      'evolucao.png'
    ];

    const tempoNaTela = 30000;

    let indiceAtual = 0;

    const slide = document.getElementById('slide');

    // troca automática das telas
    setInterval(() => {

      indiceAtual = (indiceAtual + 1) % imagens.length;

      slide.style.opacity = 0;

      setTimeout(() => {

        slide.src = imagens[indiceAtual] + '?cache=' + new Date().getTime();

        slide.style.opacity = 1;

      }, 500);

    }, tempoNaTela);

    // anti suspensão WebOS LG
    setInterval(() => {

      // micro alteração invisível
      document.body.style.opacity = "0.9999";

      setTimeout(() => {
        document.body.style.opacity = "1";
      }, 100);

      // eventos falsos
      window.dispatchEvent(new Event('mousemove'));
      window.dispatchEvent(new Event('click'));

    }, 600000); // 10 minutos

  </script>

</body>
</html>
