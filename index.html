<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>modobank • Analytics TV</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease;
      background: #000;
    }

    .frame.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 34px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div id="loading">Carregando painel de indicadores...</div>

  <script>
    const paginas = [
      'https://datastudio.google.com/embed/reporting/3ade70de-4dda-4e6d-9f8c-89e3376ab4f6/page/YhMpF?rm=minimal',
      'https://datastudio.google.com/embed/reporting/3ade70de-4dda-4e6d-9f8c-89e3376ab4f6/page/p_yds5rmxw1d?rm=minimal',
      'https://datastudio.google.com/embed/reporting/3ade70de-4dda-4e6d-9f8c-89e3376ab4f6/page/p_tswfecck2d?rm=minimal',
      'https://datastudio.google.com/embed/reporting/3ade70de-4dda-4e6d-9f8c-89e3376ab4f6/page/p_h4lqhtil2d?rm=minimal',
      'https://datastudio.google.com/embed/reporting/3ade70de-4dda-4e6d-9f8c-89e3376ab4f6/page/p_ifsapre82d?rm=minimal',
      'https://datastudio.google.com/embed/reporting/3ade70de-4dda-4e6d-9f8c-89e3376ab4f6/page/p_3a7cg1j82d?rm=minimal'
    ];

    const tempoPorTela = 30000; // 30 seg
    const tempoInicialDeCarga = 45000; // TV carregar tudo

    let paginaAtual = 0;
    const frames = [];

    paginas.forEach((url, index) => {
      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.className = 'frame';
      iframe.setAttribute('allowfullscreen', 'true');
      iframe.setAttribute('loading', 'eager');
      document.body.appendChild(iframe);
      frames.push(iframe);
    });

    function mostrarPagina(index) {
      frames.forEach((frame, i) => {
        frame.classList.toggle('active', i === index);
      });
    }

    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';

      mostrarPagina(paginaAtual);

      setInterval(() => {
        paginaAtual = (paginaAtual + 1) % frames.length;
        mostrarPagina(paginaAtual);
      }, tempoPorTela);

    }, tempoInicialDeCarga);
  </script>

</body>
</html>
