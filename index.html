<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>modobank • Analytics TV</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #a9c7e3;
      font-family: Arial, sans-serif;
    }

    #container {
      width: 100%;
      height: 100%;
      position: relative;
      background: #a9c7e3;
    }

    #slide {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #a9c7e3;
      opacity: 1;
      transition: opacity 0.8s ease;
    }

    #loading {
      position: absolute;
      inset: 0;
      background: #a9c7e3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      color: #1d246b;
    }

    .spinner {
      width: 70px;
      height: 70px;
      border: 8px solid rgba(29, 36, 107, 0.15);
      border-top: 8px solid #4f46e5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 30px;
    }

    .texto {
      font-size: 34px;
      font-weight: bold;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div id="container">

    <div id="loading">
      <div class="spinner"></div>
      <div class="texto">Carregando indicadores...</div>
    </div>

    <img id="slide" src="" alt="Dashboard modobank" />

  </div>

  <script>
    const imagens = [
      'geral.png',
      'comercial.png',
      'crescimento.png',
      'tarifas.png',
      'ranking.png',
      'evolucao.png'
    ];

    const tempoNaTela = 30000;
    const recarregarTudoDepoisDe = 6 * 60 * 60 * 1000;

    let indiceAtual = 0;

    const slide = document.getElementById('slide');
    const loading = document.getElementById('loading');

    function carregarImagem() {
      const novaImagem = new Image();

      novaImagem.onload = () => {
        slide.style.opacity = 0;

        setTimeout(() => {
          slide.src = novaImagem.src;
          slide.style.opacity = 1;
          loading.style.display = 'none';
        }, 300);
      };

      novaImagem.src = imagens[indiceAtual] + '?v=' + Date.now();
    }

    function trocarTela() {
      indiceAtual++;

      if (indiceAtual >= imagens.length) {
        indiceAtual = 0;
      }

      carregarImagem();
    }

    carregarImagem();

    setInterval(trocarTela, tempoNaTela);

    setTimeout(() => {
      window.location.reload();
    }, recarregarTudoDepoisDe);

    // anti suspensão LG WebOS
    setInterval(() => {
      document.body.style.opacity = "0.9999";

      setTimeout(() => {
        document.body.style.opacity = "1";
      }, 50);

      window.dispatchEvent(new Event('mousemove'));
    }, 20000);
  </script>

</body>

</html>
