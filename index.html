<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>modobank • Analytics TV</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    #status {
      position: fixed;
      bottom: 12px;
      right: 18px;
      color: rgba(255,255,255,0.55);
      font-family: Arial, sans-serif;
      font-size: 18px;
      z-index: 99;
    }
  </style>
</head>

<body>

  <iframe id="dashboard"></iframe>
  <div id="status"></div>

  <script>
    const paginas = [
      'https://datastudio.google.com/embed/reporting/3ade70de-4dda-4e6d-9f8c-89e3376ab4f6/page/YhMpF?rm=minimal',
      'https://datastudio.google.com/embed/reporting/3ade70de-4dda-4e6d-9f8c-89e3376ab4f6/page/p_yds5rmxw1d?rm=minimal',
      'https://datastudio.google.com/embed/reporting/3ade70de-4dda-4e6d-9f8c-89e3376ab4f6/page/p_tswfecck2d?rm=minimal',
      'https://datastudio.google.com/embed/reporting/3ade70de-4dda-4e6d-9f8c-89e3376ab4f6/page/p_h4lqhtil2d?rm=minimal',
      'https://datastudio.google.com/embed/reporting/3ade70de-4dda-4e6d-9f8c-89e3376ab4f6/page/p_ifsapre82d?rm=minimal',
      'https://datastudio.google.com/embed/reporting/3ade70de-4dda-4e6d-9f8c-89e3376ab4f6/page/p_3a7cg1j82d?rm=minimal'
    ];

    const tempoPorTela = 45000; // 45 segundos
    const ciclosAntesDeRecarregar = 3; // 3 voltas completas

    let paginaAtual = 0;
    let ciclosCompletos = 0;

    const iframe = document.getElementById('dashboard');
    const status = document.getElementById('status');

    function carregarPagina() {
      iframe.src = paginas[paginaAtual];

      status.innerText = `Tela ${paginaAtual + 1} de ${paginas.length}`;

      paginaAtual++;

      if (paginaAtual >= paginas.length) {
        paginaAtual = 0;
        ciclosCompletos++;
      }

      if (ciclosCompletos >= ciclosAntesDeRecarregar) {
        setTimeout(() => {
          window.location.reload();
        }, tempoPorTela);
        return;
      }

      setTimeout(carregarPagina, tempoPorTela);
    }

    window.onload = () => {
      paginaAtual = 0;
      ciclosCompletos = 0;
      carregarPagina();
    };
  </script>

</body>
</html>
